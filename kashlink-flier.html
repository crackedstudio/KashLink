<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 1200px; }
  body {
    font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1f2348; color: #fff; position: relative; overflow: hidden;
  }
  .wrap { position: absolute; inset: 0; padding: 80px 88px 76px; display: flex; flex-direction: column; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 64px; height: 64px; }
  .brand span { font-weight: 800; font-size: 34px; letter-spacing: -0.6px; }

  h1 { margin-top: 84px; font-weight: 900; font-size: 92px; line-height: 1.02; letter-spacing: -3px; }
  h1 em { font-style: normal; color: #e9b213; }
  .sub { margin-top: 22px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,.62); }

  /* chat mock */
  .chat { margin-top: 92px; display: flex; flex-direction: column; gap: 18px; width: 640px; }
  .bubble {
    align-self: flex-end; background: #0582ca; color: #fff; border-radius: 22px 22px 6px 22px;
    padding: 22px 26px; font-size: 26px; font-weight: 600; line-height: 1.35; max-width: 560px;
  }
  .bubble .link { display: block; margin-top: 8px; color: #fff; text-decoration: underline; text-underline-offset: 5px; text-decoration-color: rgba(255,255,255,.55); word-break: break-all; font-weight: 700; }
  .card {
    align-self: flex-start; background: #fff; color: #1f2348; border-radius: 22px 22px 22px 6px;
    padding: 24px 26px; width: 420px; display: flex; flex-direction: column; gap: 16px;
  }
  .card .row { display: flex; align-items: center; gap: 16px; }
  .card .row svg { width: 52px; height: 52px; flex: none; }
  .card .amt { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1; }
  .card .from { font-size: 18px; font-weight: 600; color: rgba(31,35,72,.55); margin-top: 6px; }
  .card .btn {
    background: #0582ca; color: #fff; border-radius: 14px; text-align: center; padding: 16px;
    font-size: 22px; font-weight: 800;
  }

  .bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .url { font-size: 58px; font-weight: 900; letter-spacing: -2px; color: #e9b213; line-height: 1; }
  .meta { text-align: right; font-size: 21px; font-weight: 600; color: rgba(255,255,255,.55); line-height: 1.6; }
  .meta b { color: #fff; font-weight: 700; }

  .bighex { position: absolute; right: -120px; top: 300px; width: 520px; height: 520px; opacity: .035; }
</style></head>
<body>
  <svg class="bighex" viewBox="0 0 100 100"><path d="M50 3l41 23.5v47L50 97 9 73.5v-47z" fill="#fff"/></svg>

  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#EC991C"/><stop offset="1" stop-color="#E9B213"/></linearGradient></defs>
        <path d="M50 3l41 23.5v47L50 97 9 73.5v-47z" fill="url(#g)"/>
        <path d="M50 19l27 15.5v31L50 81 23 65.5v-31z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
        <text x="50" y="66" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="900" font-size="44" fill="#fff">K</text>
      </svg>
      <span>KashLink</span>
    </div>

    <h1>Send NIM<br>with <em>a link.</em></h1>
    <p class="sub">No wallet address needed.</p>

    <div class="chat">
      <div class="bubble">
        Lunch is on me 🍜 claim it here
        <span class="link">kashlink.live/#Fa3kq…</span>
      </div>
      <div class="card">
        <div class="row">
          <svg viewBox="0 0 100 100">
            <path d="M50 3l41 23.5v47L50 97 9 73.5v-47z" fill="url(#g)"/>
            <path d="M50 19l27 15.5v31L50 81 23 65.5v-31z" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
            <text x="50" y="66" text-anchor="middle" font-family="Mulish, sans-serif" font-weight="900" font-size="44" fill="#fff">K</text>
          </svg>
          <div>
            <div class="amt">50 NIM</div>
            <div class="from">Cash Link · ready to claim</div>
          </div>
        </div>
        <div class="btn">Claim cash</div>
      </div>
    </div>

    <div class="bottom">
      <div class="url">kashlink.live</div>
      <div class="meta">
        A mini app for <b>Nimiq Pay</b><br>
        Free to send · Free to claim · Revert anytime
      </div>
    </div>
  </div>
</body></html>
